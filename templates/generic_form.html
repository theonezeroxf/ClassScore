{% extends 'base.html' %}{% block content %}<section class="card"><h1>{{title}}</h1><form method="post">{% csrf_token %}{{form.as_p}}{% if geolocation %}<button type="button" onclick="locate()">使用当前位置</button>{% endif %}<button>保存</button></form></section>{% endblock %}{% block scripts %}{% if geolocation %}<script>function locate(){navigator.geolocation.getCurrentPosition(p=>{document.querySelector('#id_center_lat').value=p.coords.latitude;document.querySelector('#id_center_lng').value=p.coords.longitude},()=>alert('无法获取位置，请检查浏览器权限'))}</script>{% endif %}{% endblock %}
