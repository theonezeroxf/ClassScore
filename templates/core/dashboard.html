{% extends 'base.html' %}
{% block content %}
<div class="hero">
  <h1>课堂签到与成绩管理</h1>
  <p>欢迎，{{ user.username }}。从班级开始管理课堂。</p>
  <a class="button" href="{% url 'class-create' %}">新建班级</a>
</div>
<div class="grid">
  {% for c in classes %}
  <a class="card" href="{% url 'class-detail' c.pk %}"
    ><h2>{{ c.name }}</h2>
    <p>{{ c.students.count }} 名学生</p></a
  >
  {% empty %}
  <p class="empty">尚无班级，请先新建。</p>
  {% endfor %}
</div>
{% endblock %}
