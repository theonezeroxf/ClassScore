{% extends 'base.html' %}
{% block content %}
<h1>{{ session.title }} 签到记录</h1>
<table>
  <tr>
    <th>学号</th>
    <th>姓名</th>
    <th>距离</th>
    <th>时间</th>
  </tr>
  {% for r in session.records.all %}
  <tr>
    <td>{{ r.student_no_snapshot }}</td>
    <td>{{ r.student_name_snapshot }}</td>
    <td>{{ r.distance_m|floatformat:0 }} m</td>
    <td>{{ r.signed_at }}</td>
  </tr>
  {% empty %}
  <tr>
    <td colspan="4">暂无签到</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
