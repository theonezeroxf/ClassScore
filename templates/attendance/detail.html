{% extends 'base.html' %}
{% block content %}
<section class="card center">
  <h1>{{ session.title }}</h1>
  <img class="qr" src="data:image/png;base64,{{ qr }}" />
  <p><a href="{{ link }}">{{ link }}</a></p>
  <p>{{ session.start_time }} 至 {{ session.end_time }}</p>
  <p>
    已签到 {{ session.records.count }} / {{ session.class_room.students.count }}
  </p>
  <a class="button" href="{% url 'attendance-records' session.pk %}">刷新记录</a>
  <a
    class="button"
    href="{% url 'draw' session.class_room_id %}?session={{ session.pk }}"
    >从签到学生抽取</a
  >
</section>
{% endblock %}
